<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 300" width="1480" height="300" role="img" aria-labelledby="flowTitle">
  <title id="flowTitle">7-step patent translation workflow: Project Setup, Translation Memory Lookup, AI First Draft, Automated Quality Checks, AI-Assisted Review, Human Review, Delivery with Translation Notes</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B9AF9C"/>
    </marker>
  </defs>

  <!-- connecting line -->
  <line x1="60" y1="150" x2="1420" y2="150" stroke="#D9D2C5" stroke-width="2"/>

  <!-- step boxes: x-start, label lines, number -->
  <!-- Step 1 -->
  <g>
    <rect x="20" y="95" width="170" height="110" rx="6" fill="#FFFFFF" stroke="#D9D2C5" stroke-width="1.5"/>
    <circle cx="105" cy="80" r="18" fill="#F2EFE7" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="105" y="86" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1B2A4A">1</text>
    <text x="105" y="145" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">Project</text>
    <text x="105" y="167" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">Setup</text>
    <text x="105" y="192" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">Terminology locked</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="215" y="95" width="170" height="110" rx="6" fill="#FFFFFF" stroke="#D9D2C5" stroke-width="1.5"/>
    <circle cx="300" cy="80" r="18" fill="#F2EFE7" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="300" y="86" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1B2A4A">2</text>
    <text x="300" y="145" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">TM</text>
    <text x="300" y="167" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">Lookup</text>
    <text x="300" y="192" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">Past filings carry over</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="410" y="95" width="170" height="110" rx="6" fill="#FFFFFF" stroke="#D9D2C5" stroke-width="1.5"/>
    <circle cx="495" cy="80" r="18" fill="#F2EFE7" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="495" y="86" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1B2A4A">3</text>
    <text x="495" y="145" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">AI First</text>
    <text x="495" y="167" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">Draft</text>
    <text x="495" y="192" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">Claude on AWS Bedrock</text>
  </g>

  <!-- Step 4 -->
  <g>
    <rect x="605" y="95" width="170" height="110" rx="6" fill="#FFFFFF" stroke="#D9D2C5" stroke-width="1.5"/>
    <circle cx="690" cy="80" r="18" fill="#F2EFE7" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="690" y="86" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1B2A4A">4</text>
    <text x="690" y="145" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">Automated</text>
    <text x="690" y="167" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">QC</text>
    <text x="690" y="192" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">Mechanical errors caught</text>
  </g>

  <!-- Step 5 -->
  <g>
    <rect x="800" y="95" width="170" height="110" rx="6" fill="#FFFFFF" stroke="#D9D2C5" stroke-width="1.5"/>
    <circle cx="885" cy="80" r="18" fill="#F2EFE7" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="885" y="86" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1B2A4A">5</text>
    <text x="885" y="145" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">AI-Assisted</text>
    <text x="885" y="167" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">Review</text>
    <text x="885" y="192" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">Risk-tagged for me</text>
  </g>

  <!-- Step 6: Human Review, featured -->
  <g>
    <rect x="995" y="85" width="190" height="130" rx="6" fill="#1B2A4A" stroke="#1B2A4A" stroke-width="1.5"/>
    <circle cx="1090" cy="70" r="19" fill="#1B2A4A" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="1090" y="76" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">6</text>
    <text x="1090" y="140" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Human</text>
    <text x="1090" y="163" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Review</text>
    <text x="1090" y="188" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#E8E3D6">Every sentence, by me</text>
    <text x="1090" y="205" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="11" font-style="italic" fill="#9FB0A3">This is the work</text>
  </g>

  <!-- Step 7 -->
  <g>
    <rect x="1210" y="95" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#D9D2C5" stroke-width="1.5"/>
    <circle cx="1300" cy="80" r="18" fill="#F2EFE7" stroke="#1B2A4A" stroke-width="1.5"/>
    <text x="1300" y="86" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#1B2A4A">7</text>
    <text x="1300" y="145" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">Delivery</text>
    <text x="1300" y="167" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">With translation</text>
    <text x="1300" y="184" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">notes</text>
  </g>

  <!-- arrows between boxes -->
  <line x1="190" y1="150" x2="213" y2="150" stroke="#B9AF9C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="385" y1="150" x2="408" y2="150" stroke="#B9AF9C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="150" x2="603" y2="150" stroke="#B9AF9C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775" y1="150" x2="798" y2="150" stroke="#B9AF9C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="150" x2="993" y2="150" stroke="#B9AF9C" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1185" y1="150" x2="1208" y2="150" stroke="#B9AF9C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- caption row: automation vs human split -->
  <text x="495" y="260" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#5D7561">STEPS 1&#8211;5: AUTOMATED</text>
  <text x="1145" y="260" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#5D7561">STEPS 6&#8211;7: HUMAN-LED</text>
  <line x1="20" y1="240" x2="970" y2="240" stroke="#E8E3D6" stroke-width="2"/>
  <line x1="993" y1="240" x2="1390" y2="240" stroke="#E8E3D6" stroke-width="2"/>
</svg>
