<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 320" width="1300" height="320" role="img" aria-labelledby="timelineTitle">
  <title id="timelineTitle">Career timeline: joined a Japanese patent translation company in 2019, 5 years 9 months in-house reviewing and translating patents, transitioned to full-time freelance in 2025, now past 13 million words of patent content overall</title>

  <!-- baseline -->
  <line x1="80" y1="160" x2="1220" y2="160" stroke="#D9D2C5" stroke-width="2"/>

  <!-- Point 1: 2019 -->
  <circle cx="140" cy="160" r="9" fill="#1B2A4A"/>
  <text x="140" y="130" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#1B2A4A">2019</text>
  <text x="140" y="108" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="600" fill="#1B2A4A">Joined In-House</text>
  <text x="140" y="188" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">Japanese patent</text>
  <text x="140" y="204" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">translation company</text>

  <!-- Point 2: ~2024 -->
  <circle cx="460" cy="160" r="9" fill="#1B2A4A"/>
  <text x="460" y="130" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#1B2A4A">5y 9m In-House</text>
  <text x="460" y="108" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="600" fill="#1B2A4A">80% Review</text>
  <text x="460" y="188" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">2M+ words/year</text>
  <text x="460" y="204" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">of patent content</text>

  <!-- Point 3: 2025 -->
  <circle cx="820" cy="160" r="9" fill="#1B2A4A"/>
  <text x="820" y="130" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#1B2A4A">2025</text>
  <text x="820" y="108" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="600" fill="#1B2A4A">Full-Time Freelance</text>
  <text x="820" y="188" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">Translation becomes</text>
  <text x="820" y="204" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#5A6075">primary deliverable</text>

  <!-- Point 4: Now, featured -->
  <circle cx="1150" cy="160" r="11" fill="#5D7561" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="1055" y="60" width="190" height="52" rx="6" fill="#1B2A4A"/>
  <text x="1150" y="82" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">13M+ Words Overall</text>
  <text x="1150" y="100" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#E8E3D6">10M reviewed &#183; 3M translated</text>
  <text x="1150" y="188" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#5D7561">Now</text>
</svg>
