{{ $url := .Get "url" }}
{{ $title := .Get "title" }}
{{ $desc := .Get "desc" }}
{{ $domain := .Get "domain" }}
{{ if not $domain }}
  {{ $parsed := urls.Parse $url }}
  {{ $domain = $parsed.Host }}
{{ end }}
<a class="link-preview-card" href="{{ $url }}" target="_blank" rel="noopener noreferrer">
  <span class="link-preview-domain">{{ $domain }}</span>
  <span class="link-preview-title">{{ $title }}</span>
  {{ if $desc }}<span class="link-preview-desc">{{ $desc }}</span>{{ end }}
</a>
